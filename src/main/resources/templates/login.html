<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Mangak - Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>
<body>
<div class="login-container">
    <div class="logo">
        MANGAK
    </div>
    <div class="form-error" th:if="${error}" th:text="${error}">
        Invalid username or password
    </div>

    <!-- Form starts -->
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">USERNAME</label>
            <input type="text" name="username" id="username" placeholder="Enter your username" required>
        </div>

        <div class="form-group">
            <label for="password">PASSWORD</label>
            <input type="password" name="password" id="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="login-button">LOGIN</button>
    </form>
    <!-- Form ends -->

    <div class="divider">
        <span class="divider-text">OR</span>
    </div>

    <div class="social-login">
        <div class="social-icon">
            <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" width="20" alt="Google">
        </div>
        <div class="social-icon">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" width="20" alt="Facebook">
        </div>
        <div class="social-icon">
            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png" width="20" alt="Twitter">
        </div>
    </div>

    <div class="signup-link">
        Don't have an account? <a th:href="@{/signup}">Sign up</a>
    </div>
</div>
</body>
</html>
