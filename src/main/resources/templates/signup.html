<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Mangak - Sign Up</title>
    <link rel="stylesheet" th:href="@{/css/signup.css}" />
</head>
<body>
<div class="signup-container">
    <div class="logo">
        <img src="https://c.animaapp.com/sQX015zO/img/mangak.png" alt="Mangak Logo">
    </div>

    <div class="form-error" th:if="${error}" th:text="${error}">
        Something went wrong
    </div>

    <!-- Form starts -->
    <form th:action="@{/signup}" method="post">
        <div class="form-group">
            <label for="username">USERNAME</label>
            <input type="text" name="username" id="username" placeholder="Choose a username" required>
        </div>

        <div class="form-group">
            <label for="email">EMAIL</label>
            <input type="email" name="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="password">PASSWORD</label>
            <input type="password" name="password" id="password" placeholder="Create a password" required>
        </div>

        <div class="form-group">
            <label for="confirm-password">CONFIRM PASSWORD</label>
            <input type="password" name="confirmPassword" id="confirm-password" placeholder="Confirm your password" required>
        </div>

        <button type="submit" class="signup-button">SIGN UP</button>
    </form>
    <!-- Form ends -->

    <div class="terms">
        By signing up, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
    </div>

    <div class="login-link">
        Already have an account? <a th:href="@{/login}">Log in</a>
    </div>
</div>
</body>
</html>
